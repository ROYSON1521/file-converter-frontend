<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Converter App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      background-image: radial-gradient(ellipse at 12% 18%, rgba(255, 224, 222, .74), transparent 34%), radial-gradient(ellipse at 88% 78%, rgba(255, 234, 218, .78), transparent 36%);
      margin: 0;
      padding: 96px 20px 40px;
      min-height: 100vh;
      min-height: 100svh;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #24262d;
      position: relative;
      isolation: isolate;
      overflow-x: hidden;
    }
    .motion-scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
    .motion-glow { position: absolute; width: 360px; height: 360px; border-radius: 50%; background: rgba(255, 80, 69, .10); filter: blur(65px); animation: glowDrift 11s ease-in-out infinite alternate; }
    .motion-glow.one { left: 4%; top: 20%; }
    .motion-glow.two { right: 5%; bottom: 8%; background: rgba(255, 166, 91, .15); animation-delay: -5s; }
    .file-float { position: absolute; width: 142px; height: 164px; padding: 16px; box-sizing: border-box; border: 1px solid rgba(255,255,255,.9); border-radius: 18px; background: rgba(255,255,255,.84); box-shadow: 0 22px 55px rgba(49,38,38,.10); backdrop-filter: blur(10px); animation: floatFile 7s ease-in-out infinite; }
    .file-float.one { left: max(7%, calc(50% - 540px)); top: 25%; }
    .file-float.two { right: max(8%, calc(50% - 540px)); top: 19%; animation-delay: -2.5s; }
    .file-float.three { right: max(13%, calc(50% - 570px)); bottom: 12%; animation-delay: -4.5s; }
    .file-float.four { left: 3%; bottom: 15%; width: 124px; height: 146px; animation-delay: -1.5s; }
    .file-float.five { right: 3%; top: 52%; width: 124px; height: 146px; animation-delay: -3.5s; }
    .file-float.six { left: 28%; top: 8%; width: 118px; height: 138px; animation-delay: -5.5s; }
    .file-badge { display: grid; place-items: center; width: 48px; height: 56px; border-radius: 11px; color: white; background: #ef4943; font-size: 11px; font-weight: 800; letter-spacing: .5px; }
    .file-float.two .file-badge { background: #4988e8; }
    .file-float.three .file-badge { background: #8a62d7; }
    .file-lines { display: grid; gap: 7px; margin-top: 15px; }
    .file-lines i { display: block; height: 5px; border-radius: 8px; background: #e8e9ed; }
    .file-lines i:nth-child(2) { width: 76%; }
    .file-lines i:nth-child(3) { width: 56%; }
    .card {
      position: relative;
      z-index: 2;
      background: #fff;
      padding: 30px;
      width: min(100%, 390px);
      box-sizing: border-box;
      margin: 20px 0 0;
      border: 1px solid rgba(31,35,45,.07);
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(31,35,45,.12);
      display: none;
      animation: fade 0.3s ease-in-out;
    }
    .card.active {
      display: block;
    }
    .login-stack { display: none; position: relative; z-index: 2; width: min(100%, 390px); }
    .login-stack.active { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .login-stack .card { width: 100%; margin: 0; }
    .brand-title { margin: 0; color: #d8322c; font-family: "Trebuchet MS", "Segoe UI", sans-serif; font-size: clamp(29px, 4vw, 40px); font-weight: 900; letter-spacing: .14em; line-height: 1.1; text-align: center; text-shadow: 0 8px 22px rgba(216,50,44,.17); }
    h2 {
      text-align: center;
      margin: 0 0 22px;
      font-size: 27px;
      letter-spacing: -.5px;
    }
    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 12px;
    }
    button:hover {
      background: #5a67d8;
    }
    .note {
      font-size: 12px;
      text-align: center;
      color: #666;
    }
    .spinner {
      border: 4px solid #eee;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
}
body, .card, input, select, button {
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* 🌙 Dark mode styles */
body.dark {
  background: linear-gradient(135deg, #1f2933, #111827);
  color: #e5e7eb;
}

body.dark .card {
  background: #1f2933;
  color: #e5e7eb;
}

body.dark input,
body.dark select {
  background: #111827;
  color: #e5e7eb;
  border: 1px solid #374151;
}

body.dark button {
  background: #4f46e5;
}

body.dark .note {
  color: #9ca3af;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes fade {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
/* 🌗 Theme toggle switch */

.switch {
  position: relative;
  display: inline-block;
  flex: 0 0 56px;
  width: 56px;
  height: 30px;
  margin-right: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #cbd5e1;
  border-radius: 34px;
  transition: background-color 0.3s;
}

.slider::before {
  content: "🥵";
  position: absolute;
  height: 26px;
  width: 26px;
  left: 2px;
  bottom: 2px;
  background-color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.3s;
  font-size: 14px;
}

/* checked = dark mode */
.switch input:checked + .slider {
  background-color: #4f46e5;
}

.switch input:checked + .slider::before {
  transform: translateX(26px);
  content: "🥶";
}
/* 🌐 Top bar */
#topBar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 12px 20px;
  justify-content: space-between;
  align-items: center;
  box-sizing: border-box;
  z-index: 1000;
  display: none;
}

/* Welcome text */
#welcomeUser {
  font-size: 18px;
  font-weight: bold;
  color: white;
}

/* Dark mode welcome text */
body.dark #welcomeUser {
  color: #e5e7eb;
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 16px;
}

/* Logout button */
#logoutBtn {
  padding: 6px 14px;
  border: none;
  border-radius: 6px;
  background: #ef4444;
  color: white;
  font-weight: 600;
  cursor: pointer;
}

#logoutBtn:hover {
  background: #dc2626;
}

/* Dark mode logout */
body.dark #logoutBtn {
  background: #b91c1c;
}

/* 📁 File input resized & aligned */
input[type="file"] {
  width: 100%;
  height: 42px;                 
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #f9fafb;
  font-size: 14px;
  cursor: pointer;
  box-sizing: border-box;
}

    /* Refined tool styling */
    input, select, button { border-radius: 8px; border-color: #dfe1e6; }
    input:focus, select:focus { outline: 3px solid rgba(239,73,67,.16); border-color: #ef4943; }
    button { background: #e5322d; }
    button:hover { background: #c92722; }
    .switch input:checked + .slider { background-color: #e5322d; }
    .auth-message { display: none; padding: 11px 12px; border-radius: 8px; margin: -8px 0 14px; text-align: center; font-size: 13px; line-height: 1.4; }
    .auth-message.visible { display: block; }
    .auth-message.success { color: #176b45; background: #e9f8ef; }
    .auth-message.error { color: #a62824; background: #fff0ef; }
    body.dark .card { border-color: rgba(255,255,255,.08); }
    body.dark .file-float { background: rgba(31,41,51,.88); border-color: rgba(255,255,255,.12); }
    body.dark .file-lines i { background: #3a4655; }
    body.dark button { background: #e5322d; }
    #welcomeUser { color: #343640; }
    body.dark #welcomeUser { color: #e5e7eb; }
    @keyframes floatFile { 0%, 100% { translate: 0 0; } 50% { translate: 0 -16px; } }
    @keyframes glowDrift { from { translate: -12px 8px; scale: .92; } to { translate: 26px -18px; scale: 1.08; } }
    @media (max-width: 700px) {
      body { padding: 82px 16px 28px; }
      .file-float { opacity: .55; scale: .78; }
      .file-float.one { left: -25px; top: 12%; }
      .file-float.two { right: -28px; top: 11%; }
      .file-float.three { right: -18px; bottom: 5%; }
      .file-float.four, .file-float.five { opacity: .3; scale: .62; }
      .file-float.six { display: none; }
      .card { padding: 26px 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="motion-scene" aria-hidden="true">
    <div class="motion-glow one"></div>
    <div class="motion-glow two"></div>
    <div class="file-float one"><div class="file-badge">PDF</div><div class="file-lines"><i></i><i></i><i></i></div></div>
    <div class="file-float two"><div class="file-badge">DOCX</div><div class="file-lines"><i></i><i></i><i></i></div></div>
    <div class="file-float three"><div class="file-badge">AUDIO</div><div class="file-lines"><i></i><i></i><i></i></div></div>
    <div class="file-float four"><div class="file-badge">PPTX</div><div class="file-lines"><i></i><i></i><i></i></div></div>
    <div class="file-float five"><div class="file-badge">PNG</div><div class="file-lines"><i></i><i></i><i></i></div></div>
    <div class="file-float six"><div class="file-badge">MP3</div><div class="file-lines"><i></i><i></i><i></i></div></div>
  </div>
  
  <!-- 🌐 Top Bar -->
<div id="topBar">
  <div id="welcomeUser"></div>

  <div class="top-actions">
    <label class="switch">
      <input type="checkbox" id="themeSwitch" onchange="toggleTheme()">
      <span class="slider"></span>
    </label>
    <!-- 🚪 Logout -->
    <button id="logoutBtn" onclick="logout()">Logout</button>
  </div>
</div>

  <!-- Login Page -->
  <div class="login-stack active" id="loginStack">
  <h1 class="brand-title">FILERALUV</h1>
  <div class="card active" id="loginCard">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
     <p class="note">
    Don’t have an account?
    <a href="#" onclick="showRegister()">Register</a>
  </p>
  </div>
  </div>

   <!-- Register Page -->
<div class="card" id="registerCard">
  <h2>Register</h2>
  <p class="auth-message" id="registerMessage" role="status" aria-live="polite"></p>
  <input type="text" id="registerUsername" placeholder="Username" />
  <input type="password" id="registerPassword" placeholder="Password" />
  <button onclick="register()">Register</button>
  <p class="note">
    Already have an account?
    <a href="#" onclick="showLogin()">Login</a>
  </p>
</div>

  <!-- File Converter Page -->
  <div class="card" id="converterCard">
    <h2>File Converter</h2>
    <input type="file" id="fileInput" accept=".txt,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.webp,.mp3,.m4a"/>
    <select id="format">
      <option value="txt_to_pdf">TXT → PDF</option>
      <option value="txt_to_docx">TXT → DOCX</option>
      <option value="pdf_to_txt">PDF → TXT</option>
      <option value="docx_to_txt">DOCX → TXT</option>
      <option value="pdf_to_docx">PDF → DOCX</option>
      <option value="jpg_to_png">JPG to PNG</option>
      <option value="jpeg_to_png">JPEG to PNG</option>
      <option value="png_to_jpeg">PNG to JPEG</option>
      <option value="webp_to_jpeg">WEBP to JPEG</option>
      <option value="webp_to_png">WEBP to PNG</option>
      <option value="mp3_to_m4a">MP3 to M4A</option>
      <option value="mp3_to_wav">MP3 to WAV</option>
      <option value="mp3_to_flac">MP3 to FLAC</option>
      <option value="m4a_to_wav">M4A to WAV</option>
      <option value="docx_to_pdf">DOCX to PDF</option>
      <option value="pptx_to_pdf">PPTX to PDF</option>
    </select>
    <button id="convertBtn" onclick="convertFile()">Convert</button>
    <div id="status" class="note"></div>
    
  </div>

  <script>
const API_URL = "https://file-converter-backend-0tg6.onrender.com/convert";
const REGISTER_API = "https://file-converter-backend-0tg6.onrender.com/register";
const LOGIN_API = "https://file-converter-backend-0tg6.onrender.com/login";
const extMap = {
  txt_to_pdf: "pdf",
  txt_to_docx: "docx",
  pdf_to_txt: "txt",
  docx_to_txt: "txt",
  pdf_to_docx: "docx",
  jpg_to_png: "png",
  jpeg_to_png: "png",
  png_to_jpeg: "jpeg",
  webp_to_jpeg: "jpeg",
  webp_to_png: "png",
  mp3_to_m4a: "m4a",
  mp3_to_wav: "wav",
  mp3_to_flac: "flac",
  m4a_to_wav: "wav",
  docx_to_pdf: "pdf",
  pptx_to_pdf: "pdf"
};

// 🔒 Bonus fix: auto-login after refresh (DOM safe)
window.addEventListener("DOMContentLoaded", () => {
  // 🌗 sync theme toggle
   const savedTheme = localStorage.getItem("theme");
if (savedTheme === "dark") {
  document.body.classList.add("dark");
  document.getElementById("themeSwitch").checked = true;
}

// ✅ auto-login check
  // Require a fresh login whenever the site is opened or refreshed.
  localStorage.removeItem("token");
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("username");
  document.getElementById("converterCard").classList.remove("active");
  document.getElementById("registerCard").classList.remove("active");
  document.getElementById("loginCard").classList.add("active");
  document.getElementById("loginStack").classList.add("active");
  document.getElementById("topBar").style.display = "none";
});

// 🌗 Dark / Light mode toggle
function toggleTheme() {
  const isDark = document.body.classList.toggle("dark");

  localStorage.setItem("theme", isDark ? "dark" : "light");
  document.getElementById("themeSwitch").checked = isDark;
}

// 🔁 STEP 2: page switching logic
function showRegister() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";
  document.getElementById("registerMessage").className = "auth-message";
  document.getElementById("loginStack").classList.remove("active");
  document.getElementById("registerCard").classList.add("active");
}

function showLogin() {
  document.getElementById("registerUsername").value = "";
  document.getElementById("registerPassword").value = "";
  document.getElementById("registerMessage").className = "auth-message";
  document.getElementById("registerCard").classList.remove("active");
  document.getElementById("loginStack").classList.add("active");
}

async function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;

  if (!user || !pass) {
    alert("Enter username and password");
    return;
  }
  try {
    const res = await fetch(LOGIN_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `Server error (${res.status})`);
    if (!data.token) throw new Error("The server did not return a login token");

    localStorage.setItem("token", data.token);
    localStorage.setItem("username", user);
    localStorage.setItem("loggedIn", "true");
   
    document.getElementById("welcomeUser").textContent = "Welcome, " + user;
    document.getElementById("logoutBtn").style.display = "block";
    document.getElementById("loginStack").classList.remove("active");
    document.getElementById("converterCard").classList.add("active");
    document.getElementById("topBar").style.display = "flex";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("fileInput").value = "";
    document.getElementById("status").textContent = "";
  } catch (err) {
    localStorage.removeItem("token");
    localStorage.removeItem("loggedIn");
    localStorage.removeItem("username");
    alert("Login failed: " + (err.message || "Unable to reach the server"));
  }
}

async function register() {
  const user = document.getElementById("registerUsername").value.trim();
  const pass = document.getElementById("registerPassword").value;

  if (!user || !pass) {
    alert("Enter username and password");
    return;
  }

  try {
    const res = await fetch(REGISTER_API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `Server error (${res.status})`);

    const registerMessage = document.getElementById("registerMessage");
    const registerButton = document.querySelector("#registerCard button");
    registerMessage.textContent = "Registration successful. You can log in now. Redirecting...";
    registerMessage.className = "auth-message success visible";
    registerButton.disabled = true;
    setTimeout(() => {
      registerButton.disabled = false;
      showLogin();
    }, 1600);

  } catch (err) {
    const registerMessage = document.getElementById("registerMessage");
    registerMessage.textContent = "Registration failed: " + (err.message || "Unable to reach the server");
    registerMessage.className = "auth-message error visible";
  }
}

// 🚪 STEP 3.3: Logout
function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("loggedIn");
  localStorage.removeItem("username");

  document.getElementById("converterCard").classList.remove("active");
  document.getElementById("registerCard").classList.remove("active");
  document.getElementById("loginStack").classList.add("active");
  document.getElementById("themeSwitch").checked = document.body.classList.contains("dark");
  document.getElementById("topBar").style.display = "none";
  document.getElementById("fileInput").value = "";
  document.getElementById("status").textContent = "";
}

async function convertFile() {
    const token = localStorage.getItem("token");
    if (!token) {
        alert("Session expired. Please login again.");
        logout();
     return;
    }
  const fileInput = document.getElementById('fileInput');

  // ✅ 1. Check if file exists FIRST
  if (!fileInput.files.length) {
    alert("Please select a file");
    return;
  }

  const file = fileInput.files[0];
  const originalName = file.name.split(".").slice(0, -1).join(".");

  // ✅ 2. File validation
  const allowedTypes = [
    "application/pdf",
    "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
    "application/vnd.openxmlformats-officedocument.presentationml.presentation",
    "text/plain",
    "image/png",
    "image/jpeg",
    "image/webp",
    "audio/mpeg",
    "audio/mp4",
    "audio/x-m4a",
    "audio/m4a"
  ];

  const maxSize = 40 * 1024 * 1024; // 40 MB

  if (!allowedTypes.includes(file.type)) {
    alert("Invalid file type. Upload PDF, DOCX, PPTX, TXT, JPG, JPEG, PNG, WEBP, MP3 or M4A.");
    return;
  }

  if (file.size > maxSize) {
    alert("File size exceeds the 40 MB limit.");
    return;
  }

  const format = document.getElementById('format').value;

  // ✅ 3. Send to backend
  // STEP 2: show spinner + disable button
  const status = document.getElementById("status");
  const btn = document.getElementById("convertBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  fileInput.disabled = true;

  status.innerHTML = '<div class="spinner"></div><p>Converting...</p>';
  btn.disabled = true;
  logoutBtn.disabled = true;
  
  const formData = new FormData();
  formData.append("file", file);
  formData.append("format", format);

  try {
    const token = localStorage.getItem("token");
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
    "Authorization": "Bearer " + token
     },
      body: formData
    });

    if (!response.ok) {
      const text = await response.text();
      throw new Error(text || "Upload failed");
    }

    const blob = await response.blob();
    const url = window.URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = `${originalName}.${extMap[format]}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.URL.revokeObjectURL(url);
    fileInput.value = "";
    // STEP 3: success message + enable button
    status.textContent = "Conversion successful ✅";
    fileInput.disabled = false;
    btn.disabled = false;
    logoutBtn.disabled = false;

  } catch (error) {
    status.textContent = "Conversion failed ❌";
    fileInput.disabled = false;
    btn.disabled = false;
    logoutBtn.disabled = false;
    alert("Error: " + error.message);
  }
}
  </script>
</body>
</html>
